<!DOCTYPE html>
<html lang="en">
<head>

  <title>The Transcends Tech Hub | Where creativity meets Technology</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- External CSS Link -->
  <link rel="stylesheet" href="general-styles.css">
  <link rel="stylesheet" href="index.css">

<body>

  <!-- Dynamic Particle Canvas Background -->

  <div class="ambient-glow glow-top-left"></div>

  <!-- Main Grid Layout Container -->

    <!-- Header / Navigation -->
    <header class="main-header">
      <a href="#" class="brand-logo">

        <span class="logo-wordmark"><span class="logo-prefix">THE</span><span class="logo-text">TRANSCENDS</span></span>

      <nav class="nav-links" id="nav-menu">
        <a href="#overview" class="nav-item">Overview</a>
        <a href="#about" class="nav-item">About</a>
        <a href="#contact" class="nav-item">Contact</a>
      </nav>

      <button class="hamburger-toggle" id="hamburger-btn" type="button" aria-label="Open navigation menu" aria-controls="nav-menu" aria-expanded="false">

        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </header>

        <span class="status-dot"></span>

      </h1>

      </p>

          <span>Enter the Hub</span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>

    <!-- Footer Meta -->
    <footer class="main-footer">
      <div class="footer-left">
        <span>© 2026 The Transcend's Tech Hub</span>
      </div>
      <div class="footer-right">
